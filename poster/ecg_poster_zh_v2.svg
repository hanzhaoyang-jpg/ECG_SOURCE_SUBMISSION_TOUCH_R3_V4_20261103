<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071627"/><stop offset=".56" stop-color="#0a2334"/><stop offset="1" stop-color="#071321"/></linearGradient>
  <linearGradient id="accent" x2="1"><stop stop-color="#32d7d3"/><stop offset="1" stop-color="#91f2c8"/></linearGradient>
  <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#122e40"/><stop offset="1" stop-color="#0c2232"/></linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#95c8d1" stroke-opacity=".08"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
  <style>
    text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#eefbfc}
    .tag{font-size:24px;letter-spacing:3px;font-weight:700;fill:#7ce2d6}
    .kicker{font-size:26px;fill:#9dd5d6;letter-spacing:2px}
    .title{font-size:72px;font-weight:800;letter-spacing:2px}
    .big{font-size:52px;font-weight:750}
    .section{font-size:42px;font-weight:750}
    .cardTitle{font-size:34px;font-weight:750}
    .body{font-size:26px;fill:#c8e0e6}
    .small{font-size:22px;fill:#99b9c4}
    .num{font-size:55px;font-weight:800;fill:#78eadc}
    .mono{font-family:Consolas,monospace}
  </style>
</defs>
<rect width="1600" height="2000" fill="url(#bg)"/><rect width="1600" height="2000" fill="url(#grid)"/>
<circle cx="1450" cy="130" r="250" fill="#1f7e92" opacity=".17" filter="url(#glow)"/>
<circle cx="90" cy="1340" r="230" fill="#29aaa6" opacity=".12" filter="url(#glow)"/>

<!-- Header -->
<rect x="80" y="76" width="230" height="52" rx="26" fill="#133e4b" stroke="#56c8ca"/>
<text x="106" y="110" class="tag">FPGA · ECG</text>
<text x="80" y="212" class="kicker">2026 AMD FPGA 赛道 · 自主选题方向</text>
<text x="80" y="318" class="title">基于 Zynq-7020 的</text>
<text x="80" y="414" class="title">长时心电监测系统</text>
<rect x="80" y="456" width="160" height="7" rx="3" fill="url(#accent)"/>
<text x="80" y="528" class="big">让心电信号在端侧完成采集、分析与留存</text>
<text x="80" y="582" class="body">一块 Zynq，打通 ECG 前端、PL 推理、板端交互与有线工作站监看</text>

<!-- Signal art -->
<path d="M0 677 H185 l29 -12 20 12 h72 l21 -55 24 130 27 -180 27 105 h98 l20 -18 20 18 h158 l21 -55 25 130 27 -180 27 105 h137 l19 -16 20 16 h82 l22 -55 25 130 28 -180 26 105 h89 l18 -18 19 18 h123" fill="none" stroke="#49e4da" stroke-width="12" opacity=".18" filter="url(#glow)"/>
<path d="M0 677 H185 l29 -12 20 12 h72 l21 -55 24 130 27 -180 27 105 h98 l20 -18 20 18 h158 l21 -55 25 130 27 -180 27 105 h137 l19 -16 20 16 h82 l22 -55 25 130 28 -180 26 105 h89 l18 -18 19 18 h123" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>

<!-- Metric strip -->
<rect x="80" y="796" width="1440" height="150" rx="30" fill="url(#panel)" stroke="#286577"/>
<line x1="440" y1="824" x2="440" y2="918" stroke="#347385"/><line x1="800" y1="824" x2="800" y2="918" stroke="#347385"/><line x1="1160" y1="824" x2="1160" y2="918" stroke="#347385"/>
<text x="118" y="857" class="num mono">360 Hz</text><text x="118" y="904" class="small">设计采样率</text>
<text x="478" y="857" class="num">PL + PS</text><text x="478" y="904" class="small">软硬件协同</text>
<text x="838" y="857" class="num">N/S/V/F</text><text x="838" y="904" class="small">心搏类别标签</text>
<text x="1198" y="857" class="num">双模式</text><text x="1198" y="904" class="small">离线 / 联网</text>

<!-- Architecture -->
<text x="80" y="1043" class="section">一条贯通端侧的 ECG 处理链路</text>
<text x="80" y="1086" class="small">从波形输入到心搏事件，采集、计算、交互和记录在同一平台协同运行</text>
<g fill="url(#panel)" stroke="#2d7180" stroke-width="2">
  <rect x="80" y="1130" width="275" height="215" rx="26"/>
  <rect x="372" y="1130" width="275" height="215" rx="26"/>
  <rect x="664" y="1130" width="275" height="215" rx="26"/>
  <rect x="956" y="1130" width="275" height="215" rx="26"/>
  <rect x="1248" y="1130" width="272" height="215" rx="26"/>
</g>
<g fill="#73e1d4" font-family="Consolas" font-size="25" font-weight="bold">
  <text x="110" y="1190">01 / INPUT</text><text x="402" y="1190">02 / PL</text><text x="694" y="1190">03 / PS</text><text x="986" y="1190">04 / AI</text><text x="1278" y="1190">05 / OUTPUT</text>
</g>
<text x="110" y="1250" class="cardTitle">ECG 前端</text><text x="110" y="1297" class="small">CN121 + AD9280</text>
<text x="402" y="1250" class="cardTitle">采集与缓存</text><text x="402" y="1297" class="small">采样逻辑 · FIFO</text>
<text x="694" y="1250" class="cardTitle">信号处理</text><text x="694" y="1297" class="small">滤波 · SQI · R 峰</text>
<text x="986" y="1250" class="cardTitle">心搏推理</text><text x="986" y="1297" class="small">HLS CNN · AXI DMA</text>
<text x="1278" y="1250" class="cardTitle">结果呈现</text><text x="1278" y="1297" class="small">LCD · SD · UDP</text>
<g fill="none" stroke="#6ee4d5" stroke-width="4"><path d="M351 1233h16m-7 -8 8 8 -8 8"/><path d="M643 1233h16m-7 -8 8 8 -8 8"/><path d="M935 1233h16m-7 -8 8 8 -8 8"/><path d="M1227 1233h16m-7 -8 8 8 -8 8"/></g>

<!-- Features -->
<text x="80" y="1445" class="section">把“能看见”推进到“能分析、能追溯”</text>
<g fill="url(#panel)" stroke="#2d7180" stroke-width="2">
 <rect x="80" y="1490" width="690" height="175" rx="26"/><rect x="830" y="1490" width="690" height="175" rx="26"/>
 <rect x="80" y="1690" width="690" height="175" rx="26"/><rect x="830" y="1690" width="690" height="175" rx="26"/>
</g>
<g fill="#64dcd3"><circle cx="135" cy="1551" r="20"/><circle cx="885" cy="1551" r="20"/><circle cx="135" cy="1751" r="20"/><circle cx="885" cy="1751" r="20"/></g>
<text x="177" y="1563" class="cardTitle">端侧心搏分析</text>
<text x="177" y="1611" class="body">信号质量门控、R 峰检测与 HR/RR 计算</text>
<text x="927" y="1563" class="cardTitle">PL 端 CNN 推理通路</text>
<text x="927" y="1611" class="body">复用既有 HLS IP，输出心搏类别事件</text>
<text x="177" y="1763" class="cardTitle">本地闭环运行</text>
<text x="177" y="1811" class="body">板端波形、触摸交互与 SD 数据留存</text>
<text x="927" y="1763" class="cardTitle">按需联网监看</text>
<text x="927" y="1811" class="body">有线 UDP 接入工作站，远端查看波形</text>

<line x1="80" y1="1913" x2="1520" y2="1913" stroke="#2d7180"/>
<text x="80" y="1952" class="small">应用方向：长时观察 · 边缘信号处理教学 · 心电算法验证</text>
<text x="80" y="1984" class="small">研究与竞赛原型；心搏标签用于辅助分析，不作为医疗诊断结论。</text>
</svg>
