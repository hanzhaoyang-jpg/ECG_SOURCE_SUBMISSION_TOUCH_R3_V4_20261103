# Standalone startup profile. Use plain text, not Word.
version=1
gain=780
hp_x100=400
lp_hz=40
auto_record=1
start_delay_s=3
# First power-on verification: close both files after 120*360 samples.
# Use 7200 for two hours; 0 means unlimited and needs an actual stop control.
record_seconds=120
# 1 is ONLY for the verified Navigator PS_KEY0=MIO12 / PS_KEY1=MIO11.
# Board confirmed by the user: Navigator Zynq7020. Use 0 to disable keys.
key_profile=1
